name: Deploy Too Many Bones Solo Academy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check required pages and assets
        run: |
          set -eu
          for file in index.html getting-started.html rules.html gearlocs.html tyrants.html expansions.html solo-strategy.html research.html assets/style.css assets/site.js; do
            test -s "$file" || { echo "Missing required file: $file"; exit 1; }
          done
          echo "All required pages and assets are present."
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
